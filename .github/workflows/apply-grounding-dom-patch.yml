name: Apply grounding DOM patch

on:
  push:
    branches:
      - agent/actor-grounding-real-dom

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[grounding-dom-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/actor-grounding-real-dom
          fetch-depth: 0

      - name: Apply deterministic patch
        run: node scripts/apply-grounding-dom-patch.mjs

      - name: Commit patch if needed
        run: |
          if git diff --quiet -- src/meta/MetaGame.tsx; then
            echo "MetaGame already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/meta/MetaGame.tsx
          git commit -m "Apply real grounding DOM layer [grounding-dom-applied]"
          git push origin HEAD:agent/actor-grounding-real-dom
