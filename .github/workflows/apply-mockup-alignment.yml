name: Apply Mockup Alignment Pass

on:
  push:
    branches:
      - agent/mockup-alignment-pass-1
    paths:
      - .github/workflows/apply-mockup-alignment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mockup-alignment-pass-1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --package-lock=false
          python -m pip install --disable-pip-version-check pillow

      - name: Generate aligned art and source changes
        run: python scripts/apply_mockup_alignment.py

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove one-shot files and compiler artifacts
        run: |
          rm -f .github/workflows/apply-mockup-alignment.yml
          rm -f scripts/apply_mockup_alignment.py
          rm -f package-lock.json
          rm -f tsconfig.app.tsbuildinfo tsconfig.node.tsbuildinfo

      - name: Commit implementation
        run: |
          git config user.name "Numberdroid Art Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align Transfer Hall closer to reference mockup"
          git push origin HEAD:agent/mockup-alignment-pass-1
