name: Apply Transfer Hall Recovery

on:
  push:
    branches:
      - agent/transfer-hall-recovery
    paths:
      - .github/workflows/apply-transfer-hall-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/transfer-hall-recovery
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --quiet pillow

      - name: Generate art and traversal fixes
        run: python tools/generate_transfer_hall_recovery.py

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove one-shot files and compiler artifacts
        run: |
          git rm tools/generate_transfer_hall_recovery.py .github/workflows/apply-transfer-hall-recovery.yml
          rm -f tsconfig.tsbuildinfo tsconfig.app.tsbuildinfo tsconfig.node.tsbuildinfo

      - name: Commit implementation
        run: |
          git config user.name "Numberdroid Recovery Agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/game/maps/transferHall.ts src/game/transferHall.test.ts src/art-direction.css \
            public/assets/deck/transfer-hall-tiles.png \
            public/assets/robots/directional-pico.png \
            public/assets/robots/directional-sentry.png \
            public/assets/robots/directional-magnetar.png \
            public/assets/robots/directional-kronos.png
          git commit -m "Fix Transfer Hall traversal and recover mockup look"
          git push origin HEAD:agent/transfer-hall-recovery
