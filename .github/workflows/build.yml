  studio-windows:
    needs: changes
    if: needs.changes.outputs.studio_windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: tools/numberdroid-studio/package-lock.json

      - name: Install Studio dependencies
        working-directory: tools/numberdroid-studio
        run: npm ci --no-audit --no-fund

      - name: Verify Codex context retention on Windows
        run: node scripts/repo/codex-context-retention.selftest.mjs

      - name: Test Studio on Windows
        working-directory: tools/numberdroid-studio
        run: npm test

      - name: Check Studio build on Windows
        working-directory: tools/numberdroid-studio
        run: npm run build

      - name: Verify protected Checkpoint 1A evidence on Windows
        working-directory: tools/numberdroid-studio
        env:
          NUMBERDROID_EVIDENCE_REQUIRE_PRODUCTION_ADAPTER: '1'
        run: npm run evidence:verify

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - build
      - studio
      - studio-windows
      - deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every selected gate
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ROOT_REQUIRED: ${{ needs.changes.outputs.root }}
          ROOT_RESULT: ${{ needs.build.result }}
          STUDIO_REQUIRED: ${{ needs.changes.outputs.studio }}
          STUDIO_RESULT: ${{ needs.studio.result }}
          WINDOWS_REQUIRED: ${{ needs.changes.outputs.studio_windows }}
          WINDOWS_RESULT: ${{ needs['studio-windows'].result }}
          PAGES_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.pages == 'true' }}
          PAGES_RESULT: ${{ needs['deploy-pages'].result }}
        run: |
          require_result() {
            local name="$1"
            local required="$2"
            local result="$3"
            case "$result" in
              success)
                ;;
              skipped)
                if [ "$required" = "true" ]; then
                  echo "$name was required but skipped" >&2
                  return 1
                fi
                ;;
              *)
                echo "$name ended with $result" >&2
                return 1
                ;;
            esac
          }

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "change classification ended with $CHANGES_RESULT" >&2
            exit 1
          fi

          require_result root "$ROOT_REQUIRED" "$ROOT_RESULT"
          require_result studio "$STUDIO_REQUIRED" "$STUDIO_RESULT"
          require_result windows "$WINDOWS_REQUIRED" "$WINDOWS_RESULT"
          require_result pages "$PAGES_REQUIRED" "$PAGES_RESULT"
