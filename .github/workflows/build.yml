name: Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Binary transport preflight self-test
        run: npm run repo:binary-preflight-test

      - name: Approved source upload handoff self-test
        run: npm run repo:approved-source-handoff-test

      - name: Art toolkit self-test
        run: npm run art:toolkit-test

      - name: Generate character grounding CSS
        run: npm run generate:character-grounding

      - name: Verify committed grounding CSS matches profile
        run: git diff --exit-code -- src/meta/CharacterGrounding.generated.css

      - name: PICO grounding source diagnostic
        run: npm run diagnose:pico-grounding

      - name: PICO grounding synthetic preview
        run: npm run preview:pico-grounding

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Real-browser grounding render QA
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner"
            exit 1
          fi

          mkdir -p artifacts/grounding
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/numberdroid-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/numberdroid-preview.log
            exit 1
          fi

          # Eight-direction production-class fixture: verifies every PICO profile.
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,400 --virtual-time-budget=1000 \
            --screenshot=artifacts/grounding/browser-grounding-normal.png \
            'http://127.0.0.1:4173/?groundingFixture=1'

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,400 --virtual-time-budget=1000 \
            --screenshot=artifacts/grounding/browser-grounding-off.png \
            'http://127.0.0.1:4173/?groundingFixture=1&groundingOff=1'

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,400 --virtual-time-budget=1000 \
            --screenshot=artifacts/grounding/browser-grounding-debug.png \
            'http://127.0.0.1:4173/?groundingFixture=1&groundingDebug=1'

          node scripts/assert-grounding-browser-render.mjs \
            artifacts/grounding/browser-grounding-normal.png \
            artifacts/grounding/browser-grounding-off.png

          # Actual TS-01 MetaGame scene: real FloorVisual, world hierarchy, player
          # renderer and production CSS. This is the visual acceptance authority.
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,700 --virtual-time-budget=1400 \
            --screenshot=artifacts/grounding/browser-grounding-scene-normal.png \
            'http://127.0.0.1:4173/?groundingScene=1'

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,700 --virtual-time-budget=1400 \
            --screenshot=artifacts/grounding/browser-grounding-scene-off.png \
            'http://127.0.0.1:4173/?groundingScene=1&groundingOff=1'

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,700 --virtual-time-budget=1400 \
            --screenshot=artifacts/grounding/browser-grounding-scene-debug.png \
            'http://127.0.0.1:4173/?groundingScene=1&groundingDebug=1'

          node scripts/assert-grounding-real-scene.mjs \
            artifacts/grounding/browser-grounding-scene-normal.png \
            artifacts/grounding/browser-grounding-scene-off.png

      - name: Upload grounding diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actor-grounding-diagnostic
          path: artifacts/grounding/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: tools/numberdroid-studio/package-lock.json

      - name: Install Studio dependencies
        working-directory: tools/numberdroid-studio
        run: npm ci --no-audit --no-fund

      - name: Test Studio
        working-directory: tools/numberdroid-studio
        run: npm test

      - name: Check Studio build
        working-directory: tools/numberdroid-studio
        run: npm run build

      - name: Verify protected Checkpoint 1A evidence
        working-directory: tools/numberdroid-studio
        run: NUMBERDROID_EVIDENCE_REQUIRE_PRODUCTION_ADAPTER=1 npm run evidence:verify

      - name: Capture Studio 1A, 1B, and 2A browser evidence
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner"
            exit 1
          fi
          export STUDIO_VISUAL_BROWSER="$($CHROME --version)"
          export STUDIO_VISUAL_CANDIDATE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          export TZ=UTC
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8

          EVIDENCE="$GITHUB_WORKSPACE/artifacts/studio-visual"
          BASELINE_WORKTREE="$RUNNER_TEMP/numberdroid-studio-c1a"
          BASELINE_DATA="$RUNNER_TEMP/numberdroid-studio-c1a-data"
          CANDIDATE_DATA="$RUNNER_TEMP/numberdroid-studio-c1b-data"
          BASELINE_PID=""
          CANDIDATE_PID=""
          CHECKPOINT_2A_PID=""
          cleanup() {
            if [ -n "$BASELINE_PID" ]; then kill "$BASELINE_PID" 2>/dev/null || true; fi
            if [ -n "$CANDIDATE_PID" ]; then kill "$CANDIDATE_PID" 2>/dev/null || true; fi
            if [ -n "$CHECKPOINT_2A_PID" ]; then kill "$CHECKPOINT_2A_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          mkdir -p "$EVIDENCE/baseline-1a" "$EVIDENCE/candidate-1b/dom"
          git worktree add --detach "$BASELINE_WORKTREE" 2a7ca9cdde0179c8605163ea1f96ba1e6bce1e7d
          cp -R tools/numberdroid-studio/fixtures/checkpoint-1a/json-ledger "$BASELINE_DATA"

          NUMBERDROID_STUDIO_DATA="$BASELINE_DATA" \
          NUMBERDROID_STUDIO_STORE=json \
          NUMBERDROID_STUDIO_PORT=4318 \
            node "$BASELINE_WORKTREE/tools/numberdroid-studio/apps/studio-server/src/server.js" \
            > "$EVIDENCE/baseline-server.log" 2>&1 &
          BASELINE_PID=$!

          wait_for_studio() {
            local url="$1"
            local log="$2"
            for attempt in $(seq 1 60); do
              if curl -fsS "$url/health" >/dev/null 2>&1; then return 0; fi
              sleep 0.25
            done
            cat "$log"
            return 1
          }
          capture() {
            local width="$1"
            local output="$2"
            local url="$3"
            local mode="$4"
            local dom_output="${5:-}"
            if [ -n "$dom_output" ]; then
              node tools/numberdroid-studio/scripts/capture-studio-browser-evidence.js \
                "$CHROME" "$width" "$output" "$url" "$mode" "$dom_output"
            else
              node tools/numberdroid-studio/scripts/capture-studio-browser-evidence.js \
                "$CHROME" "$width" "$output" "$url" "$mode"
            fi
          }

          wait_for_studio http://127.0.0.1:4318 "$EVIDENCE/baseline-server.log"
          node tools/numberdroid-studio/scripts/assert-studio-baseline-visual-state.js \
            http://127.0.0.1:4318 "$EVIDENCE"
          for width in 1440 1060; do
            for workspace in overview sources assets rooms levels activity; do
              capture "$width" "$EVIDENCE/baseline-1a/$workspace-$width.png" \
                "http://127.0.0.1:4318/#$workspace" baseline
            done
          done
          kill "$BASELINE_PID"
          wait "$BASELINE_PID" 2>/dev/null || true
          BASELINE_PID=""

          node tools/numberdroid-studio/scripts/prepare-visual-evidence.js "$CANDIDATE_DATA" \
            > "$EVIDENCE/candidate-fixture.json"
          NUMBERDROID_STUDIO_DATA="$CANDIDATE_DATA" NUMBERDROID_STUDIO_PORT=4317 \
            node tools/numberdroid-studio/apps/studio-server/src/server.js \
            > "$EVIDENCE/candidate-server.log" 2>&1 &
          CANDIDATE_PID=$!
          wait_for_studio http://127.0.0.1:4317 "$EVIDENCE/candidate-server.log"
          for width in 1440 1060; do
            for workspace in overview sources assets rooms levels activity; do
              if [ "$width" = "1060" ]; then
                capture "$width" "$EVIDENCE/candidate-1b/$workspace-$width.png" \
                  "http://127.0.0.1:4317/?visualFixture=evidence#$workspace" candidate \
                  "$EVIDENCE/candidate-1b/dom/$workspace-1060.html"
              else
                capture "$width" "$EVIDENCE/candidate-1b/$workspace-$width.png" \
                  "http://127.0.0.1:4317/?visualFixture=evidence#$workspace" candidate
              fi
            done
          done
          for width in 1440 1060; do
            if [ "$width" = "1060" ]; then
              capture "$width" "$EVIDENCE/candidate-1b/overview-agent-access-$width.png" \
                'http://127.0.0.1:4317/?visualFixture=agent-access#overview' candidate \
                "$EVIDENCE/candidate-1b/dom/agent-access-1060.html"
            else
              capture "$width" "$EVIDENCE/candidate-1b/overview-agent-access-$width.png" \
                'http://127.0.0.1:4317/?visualFixture=agent-access#overview' candidate
            fi
          done

          node tools/numberdroid-studio/scripts/assert-studio-live-visual-state.js \
            http://127.0.0.1:4317 "$EVIDENCE"
          node tools/numberdroid-studio/scripts/assert-studio-visual-evidence.js "$EVIDENCE"

          CHECKPOINT_2A_DATA="$RUNNER_TEMP/numberdroid-studio-checkpoint-2a-data"
          CHECKPOINT_2A_EVIDENCE="$GITHUB_WORKSPACE/artifacts/studio-checkpoint-2a"
          mkdir -p "$CHECKPOINT_2A_EVIDENCE/dom"
          node tools/numberdroid-studio/scripts/prepare-checkpoint-2a-visual-evidence.js \
            "$CHECKPOINT_2A_DATA" > "$CHECKPOINT_2A_EVIDENCE/fixture.json"
          NUMBERDROID_STUDIO_DATA="$CHECKPOINT_2A_DATA" NUMBERDROID_STUDIO_PORT=4319 \
            node tools/numberdroid-studio/apps/studio-server/src/server.js \
            > "$CHECKPOINT_2A_EVIDENCE/server.log" 2>&1 &
          CHECKPOINT_2A_PID=$!
          wait_for_studio http://127.0.0.1:4319 "$CHECKPOINT_2A_EVIDENCE/server.log"
          for width in 1440 1060; do
            capture "$width" "$CHECKPOINT_2A_EVIDENCE/sources-intake-$width.png" \
              'http://127.0.0.1:4319/?visualFixture=checkpoint-2a#sources' checkpoint-2a
            capture "$width" "$CHECKPOINT_2A_EVIDENCE/sources-recovery-$width.png" \
              'http://127.0.0.1:4319/?visualFixture=checkpoint-2a&visualFocus=staged-intake#sources' checkpoint-2a
            capture "$width" "$CHECKPOINT_2A_EVIDENCE/sources-approved-$width.png" \
              'http://127.0.0.1:4319/?visualFixture=checkpoint-2a&visualFocus=approved-source#sources' checkpoint-2a \
              "$CHECKPOINT_2A_EVIDENCE/dom/sources-approved-$width.html"
            capture "$width" "$CHECKPOINT_2A_EVIDENCE/activity-$width.png" \
              'http://127.0.0.1:4319/?visualFixture=checkpoint-2a#activity' checkpoint-2a
          done
          kill "$CHECKPOINT_2A_PID"
          wait "$CHECKPOINT_2A_PID" 2>/dev/null || true
          CHECKPOINT_2A_PID=""

      - name: Upload Studio visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numberdroid-studio-checkpoint-1b-visual
          path: artifacts/studio-visual/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Studio Checkpoint 2A visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numberdroid-studio-checkpoint-2a-visual
          path: artifacts/studio-checkpoint-2a/
          if-no-files-found: error
          retention-days: 14
