name: Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Binary transport preflight self-test
        run: npm run repo:binary-preflight-test

      - name: Approved source upload handoff self-test
        run: npm run repo:approved-source-handoff-test

      - name: Art toolkit self-test
        run: npm run art:toolkit-test

      - name: Generate character grounding CSS
        run: npm run generate:character-grounding

      - name: Verify committed grounding CSS matches profile
        run: git diff --exit-code -- src/meta/CharacterGrounding.generated.css

      - name: PICO grounding source diagnostic
        run: npm run diagnose:pico-grounding

      - name: PICO grounding runtime preview
        run: npm run preview:pico-grounding

      - name: Upload grounding diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: actor-grounding-diagnostic
          path: artifacts/grounding/
          if-no-files-found: error
          retention-days: 14

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
