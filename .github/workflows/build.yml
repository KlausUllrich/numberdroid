name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - edited
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify change risk
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      root: ${{ steps.classify.outputs.root }}
      root_visual: ${{ steps.classify.outputs.root_visual }}
      studio: ${{ steps.classify.outputs.studio }}
      studio_visual: ${{ steps.classify.outputs.studio_visual }}
      studio_windows: ${{ steps.classify.outputs.studio_windows }}
      pages: ${{ steps.classify.outputs.pages }}
      full: ${{ steps.classify.outputs.full }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify diff whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          USE_MERGE_BASE: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0{40}$ ]]; then
            EFFECTIVE_BASE="$BASE_SHA"
            if [ "$USE_MERGE_BASE" = "true" ]; then
              EFFECTIVE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            fi
            git diff --check "$EFFECTIVE_BASE" "$HEAD_SHA"
          else
            git show --check --format= "$HEAD_SHA"
          fi

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-full') || contains(github.event.pull_request.title, '[ci-full]') }}
          USE_MERGE_BASE: ${{ github.event_name == 'pull_request' }}
        run: node scripts/repo/ci-change-classifier.mjs "$BASE_SHA" "$HEAD_SHA" "$FORCE_FULL" "$USE_MERGE_BASE" >> "$GITHUB_OUTPUT"

      - name: Verify classifier policy
        run: node scripts/repo/ci-change-classifier.selftest.mjs

      - name: Verify Codex context retention
        run: node scripts/repo/codex-context-retention.selftest.mjs

      - name: Verify repository documentation links
        run: node scripts/repo/check-markdown-links.mjs

      - name: Verify documentation checker policy
        run: node scripts/repo/check-markdown-links.selftest.mjs

      - name: Verify Studio syntax checker policy
        run: node tools/numberdroid-studio/scripts/check-javascript-syntax.selftest.js

  build:
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Binary transport preflight self-test
        run: npm run repo:binary-preflight-test

      - name: Approved source upload handoff self-test
        run: npm run repo:approved-source-handoff-test

      - name: Art toolkit self-test
        run: npm run art:toolkit-test

      - name: Generate character grounding CSS
        run: npm run generate:character-grounding

      - name: Verify committed grounding CSS matches profile
        run: git diff --exit-code -- src/meta/CharacterGrounding.generated.css

      - name: PICO grounding source diagnostic
        run: npm run diagnose:pico-grounding

      - name: PICO grounding synthetic preview
        run: npm run preview:pico-grounding

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Real-browser grounding render QA
        id: root_browser
        if: needs.changes.outputs.root_visual == 'true'
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner"
            exit 1
          fi

          mkdir -p artifacts/grounding
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/numberdroid-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/numberdroid-preview.log
            exit 1
          fi

          # Eight-direction production-class fixture: verifies every PICO profile.
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,400 --virtual-time-budget=1000 \
            --screenshot=artifacts/grounding/browser-grounding-normal.png \
            'http://127.0.0.1:4173/?groundingFixture=1'

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,400 --virtual-time-budget=1000 \
            --screenshot=artifacts/grounding/browser-grounding-off.png \
            'http://127.0.0.1:4173/?groundingFixture=1&groundingOff=1'

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,400 --virtual-time-budget=1000 \
            --screenshot=artifacts/grounding/browser-grounding-debug.png \
            'http://127.0.0.1:4173/?groundingFixture=1&groundingDebug=1'

          node scripts/assert-grounding-browser-render.mjs \
            artifacts/grounding/browser-grounding-normal.png \
            artifacts/grounding/browser-grounding-off.png

          # Actual TS-01 MetaGame scene: real FloorVisual, world hierarchy, player
          # renderer and production CSS. This is the visual acceptance authority.
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,700 --virtual-time-budget=1400 \
            --screenshot=artifacts/grounding/browser-grounding-scene-normal.png \
            'http://127.0.0.1:4173/?groundingScene=1'

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,700 --virtual-time-budget=1400 \
            --screenshot=artifacts/grounding/browser-grounding-scene-off.png \
            'http://127.0.0.1:4173/?groundingScene=1&groundingOff=1'

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=760,700 --virtual-time-budget=1400 \
            --screenshot=artifacts/grounding/browser-grounding-scene-debug.png \
            'http://127.0.0.1:4173/?groundingScene=1&groundingDebug=1'

          node scripts/assert-grounding-real-scene.mjs \
            artifacts/grounding/browser-grounding-scene-normal.png \
            artifacts/grounding/browser-grounding-scene-off.png

      - name: Upload grounding diagnostic artifact
        if: always() && (steps.root_browser.outcome == 'success' || steps.root_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: actor-grounding-diagnostic
          path: artifacts/grounding/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.pages == 'true' && needs.build.result == 'success'
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  studio:
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: tools/numberdroid-studio/package-lock.json

      - name: Install Studio dependencies
        working-directory: tools/numberdroid-studio
        run: npm ci --no-audit --no-fund

      - name: Test Studio
        working-directory: tools/numberdroid-studio
        run: npm test

      - name: Check Studio build
        working-directory: tools/numberdroid-studio
        run: npm run build

      - name: Verify protected Checkpoint 1A evidence
        working-directory: tools/numberdroid-studio
        run: NUMBERDROID_EVIDENCE_REQUIRE_PRODUCTION_ADAPTER=1 npm run evidence:verify

      - name: Capture Studio 1A, 1B, 2A, 2B, 2C, 3, and 4 browser evidence
        id: studio_browser
        if: needs.changes.outputs.studio_visual == 'true'
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner"
            exit 1
          fi
          export STUDIO_VISUAL_BROWSER="$($CHROME --version)"
          export STUDIO_VISUAL_CANDIDATE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          export TZ=UTC
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8

          EVIDENCE="$GITHUB_WORKSPACE/artifacts/studio-visual"
          BASELINE_WORKTREE="$RUNNER_TEMP/numberdroid-studio-c1a"
          BASELINE_DATA="$RUNNER_TEMP/numberdroid-studio-c1a-data"
          CANDIDATE_DATA="$RUNNER_TEMP/numberdroid-studio-c1b-data"
          BASELINE_PID=""
          CANDIDATE_PID=""
          CHECKPOINT_2A_PID=""
          CHECKPOINT_2B_PID=""
          CHECKPOINT_2C_PENDING_PID=""
          CHECKPOINT_2C_APPLIED_PID=""
          CHECKPOINT_3_PID=""
          CHECKPOINT_4_PID=""
          CHECKPOINT_4_5_PID=""
          A1_7_PID=""
          cleanup() {
            if [ -n "$BASELINE_PID" ]; then kill "$BASELINE_PID" 2>/dev/null || true; fi
            if [ -n "$CANDIDATE_PID" ]; then kill "$CANDIDATE_PID" 2>/dev/null || true; fi
            if [ -n "$CHECKPOINT_2A_PID" ]; then kill "$CHECKPOINT_2A_PID" 2>/dev/null || true; fi
            if [ -n "$CHECKPOINT_2B_PID" ]; then kill "$CHECKPOINT_2B_PID" 2>/dev/null || true; fi
            if [ -n "$CHECKPOINT_2C_PENDING_PID" ]; then kill "$CHECKPOINT_2C_PENDING_PID" 2>/dev/null || true; fi
            if [ -n "$CHECKPOINT_2C_APPLIED_PID" ]; then kill "$CHECKPOINT_2C_APPLIED_PID" 2>/dev/null || true; fi
            if [ -n "$CHECKPOINT_3_PID" ]; then kill "$CHECKPOINT_3_PID" 2>/dev/null || true; fi
            if [ -n "$CHECKPOINT_4_PID" ]; then kill "$CHECKPOINT_4_PID" 2>/dev/null || true; fi
            if [ -n "$CHECKPOINT_4_5_PID" ]; then kill "$CHECKPOINT_4_5_PID" 2>/dev/null || true; fi
            if [ -n "$A1_7_PID" ]; then kill "$A1_7_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          mkdir -p "$EVIDENCE/baseline-1a" "$EVIDENCE/candidate-1b/dom"
          git worktree add --detach "$BASELINE_WORKTREE" 2a7ca9cdde0179c8605163ea1f96ba1e6bce1e7d
          cp -R tools/numberdroid-studio/fixtures/checkpoint-1a/json-ledger "$BASELINE_DATA"

          NUMBERDROID_STUDIO_DATA="$BASELINE_DATA" \
          NUMBERDROID_STUDIO_STORE=json \
          NUMBERDROID_STUDIO_PORT=4318 \
            node "$BASELINE_WORKTREE/tools/numberdroid-studio/apps/studio-server/src/server.js" \
            > "$EVIDENCE/baseline-server.log" 2>&1 &
          BASELINE_PID=$!

          wait_for_studio() {
            local url="$1"
            local log="$2"
            for attempt in $(seq 1 60); do
              if curl -fsS "$url/health" >/dev/null 2>&1; then return 0; fi
              sleep 0.25
            done
            cat "$log"
            return 1
          }
          capture() {
            local width="$1"
            local output="$2"
            local url="$3"
            local mode="$4"
            local dom_output="${5:-}"
            if [ -n "$dom_output" ]; then
              timeout 180s node tools/numberdroid-studio/scripts/capture-studio-browser-evidence.js \
                "$CHROME" "$width" "$output" "$url" "$mode" "$dom_output"
            else
              timeout 180s node tools/numberdroid-studio/scripts/capture-studio-browser-evidence.js \
                "$CHROME" "$width" "$output" "$url" "$mode"
            fi
          }

          wait_for_studio http://127.0.0.1:4318 "$EVIDENCE/baseline-server.log"
          node tools/numberdroid-studio/scripts/assert-studio-baseline-visual-state.js \
            http://127.0.0.1:4318 "$EVIDENCE"
          for width in 1440 1060; do
            for workspace in overview sources assets rooms levels activity; do
              capture "$width" "$EVIDENCE/baseline-1a/$workspace-$width.png" \
                "http://127.0.0.1:4318/#$workspace" baseline
            done
          done
          kill "$BASELINE_PID"
          wait "$BASELINE_PID" 2>/dev/null || true
          BASELINE_PID=""

          node tools/numberdroid-studio/scripts/prepare-visual-evidence.js "$CANDIDATE_DATA" \
            > "$EVIDENCE/candidate-fixture.json"
          NUMBERDROID_STUDIO_DATA="$CANDIDATE_DATA" NUMBERDROID_STUDIO_PORT=4317 \
            node tools/numberdroid-studio/apps/studio-server/src/server.js \
            > "$EVIDENCE/candidate-server.log" 2>&1 &
          CANDIDATE_PID=$!
          wait_for_studio http://127.0.0.1:4317 "$EVIDENCE/candidate-server.log"
          for width in 1440 1060; do
            for workspace in overview sources assets rooms levels activity; do
              if [ "$width" = "1060" ]; then
                capture "$width" "$EVIDENCE/candidate-1b/$workspace-$width.png" \
                  "http://127.0.0.1:4317/?visualFixture=evidence#$workspace" candidate \
                  "$EVIDENCE/candidate-1b/dom/$workspace-1060.html"
              else
                capture "$width" "$EVIDENCE/candidate-1b/$workspace-$width.png" \
                  "http://127.0.0.1:4317/?visualFixture=evidence#$workspace" candidate
              fi
            done
          done
          for width in 1440 1060; do
            if [ "$width" = "1060" ]; then
              capture "$width" "$EVIDENCE/candidate-1b/overview-agent-access-$width.png" \
                'http://127.0.0.1:4317/?visualFixture=agent-access#overview' candidate \
                "$EVIDENCE/candidate-1b/dom/agent-access-1060.html"
            else
              capture "$width" "$EVIDENCE/candidate-1b/overview-agent-access-$width.png" \
                'http://127.0.0.1:4317/?visualFixture=agent-access#overview' candidate
            fi
          done

          node tools/numberdroid-studio/scripts/assert-studio-live-visual-state.js \
            http://127.0.0.1:4317 "$EVIDENCE"
          node tools/numberdroid-studio/scripts/assert-studio-visual-evidence.js "$EVIDENCE"

          CHECKPOINT_2A_DATA="$RUNNER_TEMP/numberdroid-studio-checkpoint-2a-data"
          CHECKPOINT_2A_EVIDENCE="$GITHUB_WORKSPACE/artifacts/studio-checkpoint-2a"
          mkdir -p "$CHECKPOINT_2A_EVIDENCE/dom"
          node tools/numberdroid-studio/scripts/prepare-checkpoint-2a-visual-evidence.js \
            "$CHECKPOINT_2A_DATA" > "$CHECKPOINT_2A_EVIDENCE/fixture.json"
          NUMBERDROID_STUDIO_DATA="$CHECKPOINT_2A_DATA" NUMBERDROID_STUDIO_PORT=4319 \
            node tools/numberdroid-studio/apps/studio-server/src/server.js \
            > "$CHECKPOINT_2A_EVIDENCE/server.log" 2>&1 &
          CHECKPOINT_2A_PID=$!
          wait_for_studio http://127.0.0.1:4319 "$CHECKPOINT_2A_EVIDENCE/server.log"
          for width in 1440 1060; do
            capture "$width" "$CHECKPOINT_2A_EVIDENCE/sources-intake-$width.png" \
              'http://127.0.0.1:4319/?visualFixture=checkpoint-2a#sources' checkpoint-2a
            capture "$width" "$CHECKPOINT_2A_EVIDENCE/sources-recovery-$width.png" \
              'http://127.0.0.1:4319/?visualFixture=checkpoint-2a&visualFocus=staged-intake#sources' checkpoint-2a
            capture "$width" "$CHECKPOINT_2A_EVIDENCE/sources-approved-$width.png" \
              'http://127.0.0.1:4319/?visualFixture=checkpoint-2a&visualFocus=approved-source#sources' checkpoint-2a \
              "$CHECKPOINT_2A_EVIDENCE/dom/sources-approved-$width.html"
            capture "$width" "$CHECKPOINT_2A_EVIDENCE/activity-$width.png" \
              'http://127.0.0.1:4319/?visualFixture=checkpoint-2a#activity' checkpoint-2a
          done
          kill "$CHECKPOINT_2A_PID"
          wait "$CHECKPOINT_2A_PID" 2>/dev/null || true
          CHECKPOINT_2A_PID=""

          CHECKPOINT_2B_DATA="$RUNNER_TEMP/numberdroid-studio-checkpoint-2b-data"
          CHECKPOINT_2B_EVIDENCE="$GITHUB_WORKSPACE/artifacts/studio-checkpoint-2b"
          mkdir -p "$CHECKPOINT_2B_EVIDENCE/dom"
          node tools/numberdroid-studio/scripts/prepare-checkpoint-2b-visual-evidence.js \
            "$CHECKPOINT_2B_DATA" > "$CHECKPOINT_2B_EVIDENCE/fixture.json"
          NUMBERDROID_STUDIO_DATA="$CHECKPOINT_2B_DATA" NUMBERDROID_STUDIO_PORT=4320 \
            node tools/numberdroid-studio/apps/studio-server/src/server.js \
            > "$CHECKPOINT_2B_EVIDENCE/server.log" 2>&1 &
          CHECKPOINT_2B_PID=$!
          wait_for_studio http://127.0.0.1:4320 "$CHECKPOINT_2B_EVIDENCE/server.log"
          for width in 1440 1060; do
            capture "$width" "$CHECKPOINT_2B_EVIDENCE/cutter-canvas-$width.png" \
              'http://127.0.0.1:4320/?visualFixture=checkpoint-2b&visualFocus=cutter-canvas#sources' checkpoint-2b \
              "$CHECKPOINT_2B_EVIDENCE/dom/cutter-canvas-$width.html"
            capture "$width" "$CHECKPOINT_2B_EVIDENCE/rectangle-inspector-$width.png" \
              'http://127.0.0.1:4320/?visualFixture=checkpoint-2b&visualFocus=rectangle-inspector#sources' checkpoint-2b
            capture "$width" "$CHECKPOINT_2B_EVIDENCE/committed-slices-$width.png" \
              'http://127.0.0.1:4320/?visualFixture=checkpoint-2b&visualFocus=committed-slices#sources' checkpoint-2b
          done
          kill "$CHECKPOINT_2B_PID"
          wait "$CHECKPOINT_2B_PID" 2>/dev/null || true
          CHECKPOINT_2B_PID=""

          CHECKPOINT_2C_PENDING_DATA="$RUNNER_TEMP/numberdroid-studio-checkpoint-2c-pending-data"
          CHECKPOINT_2C_APPLIED_DATA="$RUNNER_TEMP/numberdroid-studio-checkpoint-2c-applied-data"
          CHECKPOINT_2C_EVIDENCE="$GITHUB_WORKSPACE/artifacts/studio-checkpoint-2c"
          mkdir -p "$CHECKPOINT_2C_EVIDENCE/pending/dom" "$CHECKPOINT_2C_EVIDENCE/applied/dom"
          node tools/numberdroid-studio/scripts/prepare-checkpoint-2c-visual-evidence.js \
            "$CHECKPOINT_2C_PENDING_DATA" pending > "$CHECKPOINT_2C_EVIDENCE/fixture-pending.json"
          node tools/numberdroid-studio/scripts/prepare-checkpoint-2c-visual-evidence.js \
            "$CHECKPOINT_2C_APPLIED_DATA" applied > "$CHECKPOINT_2C_EVIDENCE/fixture-applied.json"

          NUMBERDROID_STUDIO_DATA="$CHECKPOINT_2C_PENDING_DATA" NUMBERDROID_STUDIO_PORT=4321 \
            node tools/numberdroid-studio/apps/studio-server/src/server.js \
            > "$CHECKPOINT_2C_EVIDENCE/pending-server.log" 2>&1 &
          CHECKPOINT_2C_PENDING_PID=$!
          wait_for_studio http://127.0.0.1:4321 "$CHECKPOINT_2C_EVIDENCE/pending-server.log"
          for width in 1440 1060; do
            capture "$width" "$CHECKPOINT_2C_EVIDENCE/pending/proposal-review-$width.png" \
              'http://127.0.0.1:4321/?visualFixture=checkpoint-2c&visualPhase=pending&visualFocus=proposal#assets' checkpoint-2c \
              "$CHECKPOINT_2C_EVIDENCE/pending/dom/proposal-review-$width.html"
          done
          kill "$CHECKPOINT_2C_PENDING_PID"
          wait "$CHECKPOINT_2C_PENDING_PID" 2>/dev/null || true
          CHECKPOINT_2C_PENDING_PID=""

          NUMBERDROID_STUDIO_DATA="$CHECKPOINT_2C_APPLIED_DATA" NUMBERDROID_STUDIO_PORT=4322 \
            node tools/numberdroid-studio/apps/studio-server/src/server.js \
            > "$CHECKPOINT_2C_EVIDENCE/applied-server.log" 2>&1 &
          CHECKPOINT_2C_APPLIED_PID=$!
          wait_for_studio http://127.0.0.1:4322 "$CHECKPOINT_2C_EVIDENCE/applied-server.log"
          for width in 1440 1060; do
            capture "$width" "$CHECKPOINT_2C_EVIDENCE/applied/inventory-$width.png" \
              'http://127.0.0.1:4322/?visualFixture=checkpoint-2c&visualPhase=applied&visualFocus=inventory#assets' checkpoint-2c \
              "$CHECKPOINT_2C_EVIDENCE/applied/dom/inventory-$width.html"
            capture "$width" "$CHECKPOINT_2C_EVIDENCE/applied/proposal-$width.png" \
              'http://127.0.0.1:4322/?visualFixture=checkpoint-2c&visualPhase=applied&visualFocus=proposal#assets' checkpoint-2c \
              "$CHECKPOINT_2C_EVIDENCE/applied/dom/proposal-$width.html"
          done
          kill "$CHECKPOINT_2C_APPLIED_PID"
          wait "$CHECKPOINT_2C_APPLIED_PID" 2>/dev/null || true
          CHECKPOINT_2C_APPLIED_PID=""

          node tools/numberdroid-studio/scripts/verify-checkpoint-2c-bundle-roundtrip.js \
            "$CHECKPOINT_2C_APPLIED_DATA" numberdroid-studio-checkpoint-2c \
            "$RUNNER_TEMP/numberdroid-studio-checkpoint-2c-bundle-a" \
            "$RUNNER_TEMP/numberdroid-studio-checkpoint-2c-imported" \
            "$RUNNER_TEMP/numberdroid-studio-checkpoint-2c-bundle-b" \
            "$CHECKPOINT_2C_EVIDENCE/bundle-roundtrip.json"
          node tools/numberdroid-studio/scripts/finalize-checkpoint-2c-evidence.js \
            "$CHECKPOINT_2C_EVIDENCE"

          CHECKPOINT_3_EVIDENCE="$GITHUB_WORKSPACE/artifacts/studio-checkpoint-3"
          mkdir -p "$CHECKPOINT_3_EVIDENCE/dom"
          node tools/numberdroid-studio/scripts/prepare-checkpoint-3-visual-evidence.js \
            "$CHECKPOINT_2C_APPLIED_DATA" > "$CHECKPOINT_3_EVIDENCE/fixture.json"
          NUMBERDROID_STUDIO_DATA="$CHECKPOINT_2C_APPLIED_DATA" NUMBERDROID_STUDIO_PORT=4323 \
            node tools/numberdroid-studio/apps/studio-server/src/server.js \
            > "$CHECKPOINT_3_EVIDENCE/server.log" 2>&1 &
          CHECKPOINT_3_PID=$!
          wait_for_studio http://127.0.0.1:4323 "$CHECKPOINT_3_EVIDENCE/server.log"
          for width in 1440 1060; do
            capture "$width" "$CHECKPOINT_3_EVIDENCE/room-designer-$width.png" \
              'http://127.0.0.1:4323/?visualFixture=checkpoint-3#rooms' checkpoint-3 \
              "$CHECKPOINT_3_EVIDENCE/dom/room-designer-$width.html"
            capture "$width" "$CHECKPOINT_3_EVIDENCE/room-proposal-$width.png" \
              'http://127.0.0.1:4323/?visualFixture=checkpoint-3&visualFocus=proposal#rooms' checkpoint-3 \
              "$CHECKPOINT_3_EVIDENCE/dom/room-proposal-$width.html"
          done
          kill "$CHECKPOINT_3_PID"
          wait "$CHECKPOINT_3_PID" 2>/dev/null || true
          CHECKPOINT_3_PID=""
          node tools/numberdroid-studio/scripts/verify-checkpoint-2c-bundle-roundtrip.js \
            "$CHECKPOINT_2C_APPLIED_DATA" numberdroid-studio-checkpoint-2c \
            "$RUNNER_TEMP/numberdroid-studio-checkpoint-3-bundle-a" \
            "$RUNNER_TEMP/numberdroid-studio-checkpoint-3-imported" \
            "$RUNNER_TEMP/numberdroid-studio-checkpoint-3-bundle-b" \
            "$CHECKPOINT_3_EVIDENCE/bundle-roundtrip.json"

          CHECKPOINT_4_5_EVIDENCE="$GITHUB_WORKSPACE/artifacts/studio-checkpoint-4-5"
          mkdir -p "$CHECKPOINT_4_5_EVIDENCE/dom"
          node tools/numberdroid-studio/scripts/prepare-checkpoint-4-5-visual-evidence.js \
            "$CHECKPOINT_2C_APPLIED_DATA" > "$CHECKPOINT_4_5_EVIDENCE/fixture.json"
          NUMBERDROID_STUDIO_DATA="$CHECKPOINT_2C_APPLIED_DATA" NUMBERDROID_STUDIO_PORT=4325 \
            node tools/numberdroid-studio/apps/studio-server/src/server.js \
            > "$CHECKPOINT_4_5_EVIDENCE/server.log" 2>&1 &
          CHECKPOINT_4_5_PID=$!
          wait_for_studio http://127.0.0.1:4325 "$CHECKPOINT_4_5_EVIDENCE/server.log"
          for width in 1440 1060; do
            for focus in irregular rectangle prop shape-refresh; do
              capture "$width" "$CHECKPOINT_4_5_EVIDENCE/$focus-$width.png" \
                "http://127.0.0.1:4325/?visualFixture=checkpoint-4-5&visualFocus=$focus#rooms" checkpoint-4-5 \
                "$CHECKPOINT_4_5_EVIDENCE/dom/$focus-$width.html"
            done
          done
          for width in 1440 1060; do
            capture "$width" "$CHECKPOINT_4_5_EVIDENCE/shape-conflict-$width.png" \
              "http://127.0.0.1:4325/?visualFixture=checkpoint-4-5&visualFocus=shape-conflict#rooms" checkpoint-4-5 \
              "$CHECKPOINT_4_5_EVIDENCE/dom/shape-conflict-$width.html"
          done
          kill "$CHECKPOINT_4_5_PID"
          wait "$CHECKPOINT_4_5_PID" 2>/dev/null || true
          CHECKPOINT_4_5_PID=""
          node tools/numberdroid-studio/scripts/verify-checkpoint-2c-bundle-roundtrip.js \
            "$CHECKPOINT_2C_APPLIED_DATA" numberdroid-studio-checkpoint-2c \
            "$RUNNER_TEMP/numberdroid-studio-checkpoint-4-5-bundle-a" \
            "$RUNNER_TEMP/numberdroid-studio-checkpoint-4-5-imported" \
            "$RUNNER_TEMP/numberdroid-studio-checkpoint-4-5-bundle-b" \
            "$CHECKPOINT_4_5_EVIDENCE/bundle-roundtrip.json"

          CHECKPOINT_4_DATA="$RUNNER_TEMP/numberdroid-studio-checkpoint-4-data"
          CHECKPOINT_4_EVIDENCE="$GITHUB_WORKSPACE/artifacts/studio-checkpoint-4"
          mkdir -p "$CHECKPOINT_4_EVIDENCE/dom"
          node tools/numberdroid-studio/scripts/prepare-checkpoint-4-visual-evidence.js \
            "$CHECKPOINT_4_DATA" > "$CHECKPOINT_4_EVIDENCE/fixture.json"
          NUMBERDROID_STUDIO_DATA="$CHECKPOINT_4_DATA" NUMBERDROID_STUDIO_PORT=4324 \
            node tools/numberdroid-studio/apps/studio-server/src/server.js \
            > "$CHECKPOINT_4_EVIDENCE/server.log" 2>&1 &
          CHECKPOINT_4_PID=$!
          wait_for_studio http://127.0.0.1:4324 "$CHECKPOINT_4_EVIDENCE/server.log"
          for width in 1440 1060; do
            capture "$width" "$CHECKPOINT_4_EVIDENCE/task-conflict-$width.png" \
              'http://127.0.0.1:4324/?visualFixture=checkpoint-4&visualFocus=conflict#tasks' checkpoint-4 \
              "$CHECKPOINT_4_EVIDENCE/dom/task-conflict-$width.html"
            capture "$width" "$CHECKPOINT_4_EVIDENCE/task-merged-$width.png" \
              'http://127.0.0.1:4324/?visualFixture=checkpoint-4&visualFocus=merged#tasks' checkpoint-4 \
              "$CHECKPOINT_4_EVIDENCE/dom/task-merged-$width.html"
            capture "$width" "$CHECKPOINT_4_EVIDENCE/task-candidate-readonly-$width.png" \
              'http://127.0.0.1:4324/?visualFixture=checkpoint-4&visualFocus=candidate#tasks' checkpoint-4 \
              "$CHECKPOINT_4_EVIDENCE/dom/task-candidate-readonly-$width.html"
            capture "$width" "$CHECKPOINT_4_EVIDENCE/task-derived-child-$width.png" \
              'http://127.0.0.1:4324/?visualFixture=checkpoint-4&visualFocus=child#tasks' checkpoint-4 \
              "$CHECKPOINT_4_EVIDENCE/dom/task-derived-child-$width.html"
            capture "$width" "$CHECKPOINT_4_EVIDENCE/task-create-$width.png" \
              'http://127.0.0.1:4324/?visualFixture=checkpoint-4&visualFocus=create#tasks' checkpoint-4 \
              "$CHECKPOINT_4_EVIDENCE/dom/task-create-$width.html"
          done
          kill "$CHECKPOINT_4_PID"
          wait "$CHECKPOINT_4_PID" 2>/dev/null || true
          CHECKPOINT_4_PID=""

          timeout 420s node tools/numberdroid-studio/scripts/verify-review-feedback-browser.js \
            "$CHROME" "$CHECKPOINT_4_EVIDENCE/review-feedback"

          timeout 420s node tools/numberdroid-studio/scripts/verify-human-asset-authoring-browser.js \
            "$CHROME" "$CHECKPOINT_4_EVIDENCE/human-asset-authoring"

          timeout 420s node tools/numberdroid-studio/scripts/verify-room-creation-browser.js \
            "$CHROME" "$CHECKPOINT_4_EVIDENCE/room-creation"

          NUMBERDROID_BROWSER_TEST_CHROME="$CHROME" timeout 45s node --test \
            tools/numberdroid-studio/tests/browser-capture-cancellation.node-test.js

          A1_7_DATA="$(timeout 10s mktemp -d "$RUNNER_TEMP/numberdroid-studio-a1-7-data.XXXXXX")"
          A1_7_EVIDENCE="$GITHUB_WORKSPACE/artifacts/studio-a1-7"
          A1_7_RAW_LOG="$RUNNER_TEMP/numberdroid-studio-a1-7-server.log"
          mkdir -p "$A1_7_EVIDENCE"
          timeout 120s node tools/numberdroid-studio/scripts/prepare-visual-a1-7-evidence.js \
            "$A1_7_DATA" > "$A1_7_EVIDENCE/fixture.json"
          NUMBERDROID_STUDIO_DATA="$A1_7_DATA" NUMBERDROID_STUDIO_PORT=4326 \
            timeout 180s node tools/numberdroid-studio/apps/studio-server/src/server.js \
            > /dev/null 2> "$A1_7_RAW_LOG" &
          A1_7_PID=$!
          wait_for_studio http://127.0.0.1:4326 /dev/null
          for width in 1440 1060; do
            capture "$width" "$A1_7_EVIDENCE/a1-7-review-$width.png" \
              'http://127.0.0.1:4326/?visualFixture=a1-7#tasks' a1-7 \
              "$A1_7_EVIDENCE/a1-7-review-$width.dom.json"
          done
          kill "$A1_7_PID"
          wait "$A1_7_PID" 2>/dev/null || true
          A1_7_PID=""
          if timeout 10s rg -n 'token|grantId|bindingId|digest|sha256|studio://artifacts|/workspace|/home/runner|file:|[A-Za-z]:\\' "$A1_7_RAW_LOG" >/dev/null; then
            exit 1
          fi
          timeout 10s cp "$A1_7_RAW_LOG" "$A1_7_EVIDENCE/server.log"
          timeout 60s node tools/numberdroid-studio/scripts/assert-studio-a1-7-visual-evidence.js \
            "$A1_7_EVIDENCE"

          O1B_EVIDENCE="$GITHUB_WORKSPACE/artifacts/studio-o1b-backups"
          timeout 180s node tools/numberdroid-studio/scripts/capture-o1b-backups-browser-evidence.js \
            "$CHROME" "$O1B_EVIDENCE"
          if timeout 10s rg -n 'numberdroid_backup_operator=|databaseSha256|/tmp/|/workspace|/home/runner|[A-Za-z]:\\' \
            "$O1B_EVIDENCE/observation.json" >/dev/null; then
            exit 1
          fi

      - name: Upload Studio visual evidence
        if: always() && (steps.studio_browser.outcome == 'success' || steps.studio_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: numberdroid-studio-checkpoint-1b-visual
