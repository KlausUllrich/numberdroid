<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <defs>
    <style>
      .shell{fill:#d7d2c6;stroke:#565a56;stroke-width:3;stroke-dasharray:6 4;stroke-linejoin:round}
      .soft{fill:#c7bdae;stroke:#565a56;stroke-width:2}
      .family{fill:#b87955}
      .graphite{fill:#565a56}
      .teal{fill:#5b9e9a}
      .line{fill:none;stroke:#565a56;stroke-width:2;stroke-linecap:round}
    </style>
  </defs>
  <!-- 201-202: child bed, two tiles wide -->
  <g>
    <rect class="shell" x="5" y="10" width="118" height="44" rx="10"/>
    <rect class="soft" x="10" y="15" width="30" height="34" rx="8"/>
    <rect class="soft" x="44" y="15" width="72" height="34" rx="7"/>
    <rect class="family" x="93" y="20" width="16" height="12" rx="5"/>
    <path class="line" d="M43 16v32"/>
  </g>
  <!-- 203: hygiene module -->
  <g>
    <rect class="shell" x="137" y="9" width="46" height="46" rx="12"/>
    <ellipse class="soft" cx="160" cy="28" rx="15" ry="11"/>
    <ellipse class="graphite" cx="160" cy="28" rx="8" ry="5"/>
    <rect class="teal" x="155" y="42" width="10" height="6" rx="3"/>
  </g>
  <!-- 204: toy / personal storage -->
  <g>
    <rect class="shell" x="202" y="11" width="44" height="42" rx="8"/>
    <rect class="soft" x="208" y="17" width="13" height="13" rx="4"/>
    <circle class="family" cx="232" cy="23" r="7"/>
    <rect class="teal" x="211" y="37" width="28" height="8" rx="4"/>
  </g>
</svg>
